<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicShare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="first-section">
        <div class="header">
            <div class="logo">MusicShare</div>
            <ul>
                <li>genres</li>
                <li>artists</li>
                <li>settings</li>
            </ul>
        </div>
        <div class="hero">
            <div class="text">
                <div class="title">
                    Explore Music
                </div>
                <div class="description">
                    This website introduces different genres of music for you.  Have fun exploring through the music universe!
                </div>
                <button>Sign up</button>
            </div>
            <div class="img-contributor">
                <img src="image/hero-picture.jpg" alt="vinyl records">
                <div class="contributor">
                    Author: Miguel Á. Padriñán
                </div>
            </div>
        </div>
        
    </div>
    

</body>
</html>
